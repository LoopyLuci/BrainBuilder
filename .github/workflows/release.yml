name: Release

# Builds installers for Windows/macOS/Linux whenever a `v*` tag is pushed.
# Unsigned by default: real code-signing needs certificates and credentials
# only the project owner has (a Windows Authenticode cert, an Apple Developer
# ID + notarization credentials). Once those exist, set the commented-out
# secrets below and `tauri-action` will sign automatically — until then this
# produces real, working, installable-but-unsigned builds (Windows/macOS will
# show an "unknown publisher" warning; that's expected for an unsigned build,
# not a bug in this workflow).
on:
  push:
    tags:
      - "v*"

jobs:
  # Fast pre-flight gate: the same core/frontend/contract checks CI runs,
  # re-run here so a release tag can never publish installers built from a
  # red tree. Deliberately narrow (no wgpu/DSpark/e2e — those are slower and
  # covered by CI + `scripts/ship.ps1` before a human pushes the tag); this
  # is the last automated backstop, not the only one.
  gate:
    name: Release gate (tests must be green)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: cargo test (brainbuilder-core, fast/no-torch tests only)
        run: cargo test -p brainbuilder-core --lib --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - working-directory: gui
        run: npm ci

      - name: Frontend typecheck
        working-directory: gui
        run: npx tsc --noEmit

      - name: Frontend unit tests (vitest)
        working-directory: gui
        run: npm run test

      # testing/contracts/check_worker_protocol.py is the agreed location for
      # the Rust<->Python worker-protocol drift check (see scripts/ship.ps1
      # and testing/contracts/ for the source of truth). Referenced here
      # unconditionally since it's expected to exist by the time this gate
      # runs for a real release tag.
      - name: Worker protocol contract check
        run: python testing/contracts/check_worker_protocol.py

  release:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - working-directory: gui
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment once real signing credentials are added as repo secrets
          # (Settings -> Secrets and variables -> Actions):
          #
          # Windows Authenticode:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          #
          # macOS signing + notarization:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: "BrainBuilder ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false

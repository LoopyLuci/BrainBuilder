[package]
name = "bot-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
discord = ["twilight-http", "twilight-gateway", "twilight-model"]
matrix = ["matrix-sdk"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
axum = "0.7"
dotenvy = "0.15"
thiserror = "2"
url = "2"
bytes = "1"
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "hostname"], default-features = false }
teloxide = { version = "0.13", features = ["macros"] }
twilio = "1"
webrtc = "0.11"

twilight-http = { version = "0.17", optional = true }
twilight-gateway = { version = "0.17", optional = true }
twilight-model = { version = "0.17", optional = true }
matrix-sdk = { version = "0.18", default-features = false, optional = true }

[dev-dependencies]
tokio-test = "0.4"

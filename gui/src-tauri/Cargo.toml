[package]
name = "brainbuilder-gui"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = []

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog-all", "fs-create-dir", "fs-exists", "path-all"] }
brainbuilder-core = { path = "../../core", features = ["gui", "onnx", "wgpu", "pollster"] }
concierge-core = { path = "../../concierge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
libp2p = { version = "0.54", features = ["tokio", "noise", "yamux", "macros", "tcp", "mdns", "gossipsub", "request-response", "cbor"] }
axum = "0.7"
uuid = { version = "1", features = ["v4"] }
keyring = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["rustls-tls", "blocking", "json", "stream", "gzip", "brotli", "deflate"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "0.6"
rand = "0.8"
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
futures = "0.3"
bytes = "1"

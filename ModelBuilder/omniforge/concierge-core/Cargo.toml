[package]
name = "concierge-core"
version = "0.2.0"
edition = "2021"
authors = ["OmniForge <team@omniforge.ai>"]
description = "OmniForge Concierge – agentic personal assistant for model composition, training, and platform control"
license = "MIT"
repository = "https://github.com/omniforge/concierge"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
log = "0.4"
env_logger = "0.10"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"

[lib]
name = "concierge_core"
path = "src/lib.rs"

[package]
name = "omniforge"
version = "0.1.0"
description = "OmniForge – agentic AI model development environment"
authors = ["OmniForge <team@omniforge.ai>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "path-all", "fs-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
concierge-core = { path = "../concierge-core" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"], default-features = false }
zip = "0.6"
# ONNX Runtime – enable with --features onnx
ort = { version = "2.0.0-rc.4", optional = true, default-features = false, features = ["ndarray"] }
ndarray = { version = "0.15", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
onnx = ["ort", "ndarray"]

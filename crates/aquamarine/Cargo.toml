[package]
name = "aquamarine"
version = "0.6.0"
edition = "2018"
authors = [
    "Mike Lubinets <git@mkl.dev>",
    "Frank Rehberger <frehberg@gmail.com>",
]
license = "MIT"
repository = "https://github.com/mersinvald/aquamarine"
description = "A mermaid.js integration for rustdoc"
readme = "README.md"
keywords = ["proc_macro", "docs", "rustdoc", "mermaid", "diagram"]
categories = ["visualization", "development-tools::build-utils"]
include = ["src/**/*", "doc/js/**", "Cargo.toml"]

[lib]
proc-macro = true

[dependencies]
include_dir = "0.7"
itertools = "0.10"
proc-macro-error2 = { path = "../proc-macro-error2", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
pretty_assertions = "1"

[package]
name = "proc-macro-error2"
version = "2.0.1"
edition = "2021"
authors = ["CreepySkeleton <creepy-skeleton@yandex.ru>", "GnomedDev <david2005thomas@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomedDev/proc-macro-error-2"
description = "Almost drop-in replacement to panics in proc-macros"
readme = "README.md"
keywords = ["proc-macro", "error", "errors"]
categories = ["development-tools::procedural-macro-helpers"]

include = ["src/**/*", "Cargo.toml", "README.md"]

[lib]
name = "proc_macro_error2"
path = "src/lib.rs"

[dependencies.proc-macro-error-attr2]
path = "../proc-macro-error-attr2"

[dependencies.proc-macro2]
version = "1"

[dependencies.quote]
version = "1"

[dependencies.syn]
version = "2"
optional = true
default-features = false

[features]
default = ["syn-error"]
nightly = []
syn-error = ["dep:syn"]

[lints.clippy.module_name_repetitions]
level = "allow"
priority = 0

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(run_ui_tests)"]
